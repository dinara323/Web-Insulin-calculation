services:
  app:
    build:
      context: .
      target: development
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      API_TARGET: http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: npm run dev
